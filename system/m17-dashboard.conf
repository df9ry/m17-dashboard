server {
    listen 80;
    listen [::]:80;
    server_name _;                  # oder deine Domain / IP

    root /var/www/m17-dashboard/public;
    index index.html;

    # Statische Dateien direkt von nginx ausliefern
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API / Backend an Node weiterleiten
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    # Falls dein Backend auch andere Pfade hat (z. B. /sysinfo, /ws, etc.)
    # kannst du weitere location-Blöcke ergänzen, z. B.:
    #
    # location /sysinfo {
    #     proxy_pass http://127.0.0.1:8080;
    #     ... gleiche proxy_set_header wie oben ...
    # }
}
